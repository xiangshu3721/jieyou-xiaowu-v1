    - "Staging 环境 jieyou-v19-staging 及其隔离配置可能变化，执行者部署前必须重新只读核对。"
    - "现有关键词风险判断不等于完善的临床风险评估，不要求本任务证明识别所有隐晦风险。"
intent:
  user_goal: "防止用户表达可能的紧急危险时，因输入真人请求或点击任何普通预约入口而绕过必要的安全回应；同时不阻碍无风险用户自主预约。"
  observable_success: "正常真人请求可直接预约；出现即时危险或待澄清风险时，用户首先得到合适的安全信息和可执行的现实求助路径，不会被直接送入普通预约流程；近期风险上下文不会在下一句自动消失；已有聊天/预约业务保持正常。"
  non_goals:
    - "不重做整个 AI 智能导诊、不优化普通对话文风或 Prompt。"
    - "不实现临床心理诊断、不构建未成年人系统、不新增多智能体或大型风控服务。"
    - "不修改飞书表字段、预约数据模型、数据库或其他未批准的任务（例如正常倾诉误清空）。"
    - "不将普通真人导师包装成紧急救援，不提高商业预约转化率作为目标。"
