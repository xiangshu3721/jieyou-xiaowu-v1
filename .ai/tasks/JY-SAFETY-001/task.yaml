    - "scripts/deploy-*"
    - ".env*"
    - "docs/"
    - "CNAME"
authorization:
  production_deploy_allowed: false
  production_write_allowed: false
  merge_allowed: false
requirements:
  -
    id: "R001"
    priority: "must"
    scenario: "明显的迫近人身危险与主动真人请求同现"
    given: "用户在聊天中明确表达当前有自伤、伤人或迫近的人身危险"
    when: "同一句话还包含“想找真人导师/预约”等意愿"
    then: "不得直接跳普通预约表单；先展示合适的安全回应、现实紧急求助方式；不把普通导师当应急服务"
    constraints:
      - "安全优先于直接预约"
      - "不得因用户要求真人而跳过安全判断"
      - "不得依据关键词自动做临床诊断"
  -
    id: "R002"
    priority: "must"
    scenario: "所有预约入口都遵守同一风险边界"
    given: "用户可能从输入快捷语句、固定预约按钮、AI 消息 CTA 进入预约"
    when: "存在当前或近期未澄清的风险线索"
    then: "无论入口如何均不能未经必要安全处理直接进入普通预约；无风险时保留原流程"
    constraints:
      - "后台必须是风险放行最终依据"
      - "不得通过纯前端标记绕过服务端安全门禁"
  -
    id: "R003"
    priority: "must"
    scenario: "普通真人意愿可直接预约"
    given: "用户没有待处理的危险线索且明确要求真人支持"
    when: "点击固定预约入口或发出明确请求"
    then: "无需凑够三轮即可进入预约，不能额外推销或强迫继续聊"
    constraints:
      - "不增加非必要模型调用"
      - "不改变预约字段与用户授权"
  -
    id: "R004"
    priority: "must"
    scenario: "近期风险连续性、澄清与恢复"
    given: "用户在当前 Issue 近期消息中表达高危或待澄清风险"
    when: "下一句仅说“我想找真人”或进行普通回复"
    then: "系统仍考虑此前线索，并根据明确后续澄清决定是否转正常流程；不会仅凭换一句话自动消除风险，也不会永久锁死用户"
    constraints:
      - "不永久贴高风险标签"
      - "尽量复用现有 Issue 与消息上下文，不新增云端用户画像"
      - "避免仅凭一条含否定词的文本武断解除风险"
  -
    id: "R005"
    priority: "must"
    scenario: "避免误伤普通焦虑/低落表述"
    given: "用户表达普通焦虑、难过、失眠、疲惫、含否定风险或引用他人话语"
    when: "在聊天或预约入口交互"
    then: "不会机械判断为迫近危机；有歧义时适度澄清，不强行诊断或阻断所有预约"
    constraints:
      - "回归中同时含正例、负例、模糊例"
      - "不能宣称风险检测可达到 100%"
  -
    id: "R006"
    priority: "must"
    scenario: "现有聊天与预约核心链路保持不变"
    given: "既有匿名对话、Issue、聊天记录、预约摘要、状态查询已运行"
    when: "完成本轮安全修复"
    then: "原有功能行为不退化；未授权不得触碰 Production、飞书、数据库、未跟踪资料"
    constraints:
      - "不改变常规 DeepSeek Prompt 与导诊规则"
      - "不改 UI 视觉、Growth/ Learning 等非目标功能"
      - "保持 Staging 与 Production 环境隔离"
acceptance:
  -
    id: "AT001"
    requirement_ids:
      - "R001"
    method: "integration"
    environment: "local mocked dependency + staging API"
    expected: "危险表达+真人请求优先给出安全回应，不直接进入预约；核对真正进入的接口、返回内容和前端状态。"
    evidence_required:
      - "test_log"
      - "api_trace"
    release_blocking: true
  -
    id: "AT002"
    requirement_ids:
