    expected: "输入快捷真人请求、固定入口、AI 预约 CTA 三条路径均受同一安全门禁约束；危险历史存在时先处理安全，不直接跳预约。"
    evidence_required:
      - "browser_e2e"
      - "test_log"
    release_blocking: true
  -
    id: "AT003"
    requirement_ids:
      - "R003"
    method: "browser_e2e"
    environment: "local browser + staging"
    expected: "普通用户首句要求真人、固定预约入口，均可在无额外三轮限制下正常进入预约；不写入正式飞书。"
    evidence_required:
      - "browser_e2e"
    release_blocking: true
  -
    id: "AT004"
    requirement_ids:
      - "R004"
    method: "integration"
    environment: "local + staging API"
    expected: "先表达高风险再请求真人，风险未澄清时不放行；出现合适的安全澄清后能恢复正常支持且不永久锁定。"
    evidence_required:
      - "test_log"
      - "api_trace"
    release_blocking: true
  -
    id: "AT005"
    requirement_ids:
      - "R005"
    method: "unit"
    environment: "local"
    expected: "覆盖危险/模糊/无危险/否定/引述等代表性正反例，避免普通焦虑触发不当紧急分流；说明风险识别的能力边界。"
    evidence_required:
      - "test_log"
    release_blocking: true
  -
    id: "AT006"
    requirement_ids:
      - "R006"
    method: "integration"
    environment: "local + existing staging isolated environment"
    expected: "类型检查、全量自动测试、Pages/CloudBase 构建和 Staging 安全检查通过，聊天/预约基本接口不回归；Production 无改动；报告未实测项。"
    evidence_required:
      - "test_log"
      - "api_trace"
      - "manual_check"
    release_blocking: true
guardrails:
  - "遵守 XSH AI Dev Protocol V1.0：Rxxx→ATxxx 双向映射，真实证据，不把 Mock/HTTP200 当完整业务验收。"
  - "执行前核对仓库 main SHA、现有安全规则/快速入口逻辑；若已不同需重新核对，不依据旧代码盲改。"
  - "优先复用现有安全判断；如必须增加极小安全校验接口，先说明理由，不引入独立服务、多智能体、复杂持久化。"
  - "真实风险内容仅用虚构测试用例，不采集、不上传用户真实敏感聊天数据。"
  - "不自动合并 PR，不改生产函数/Pages，不向 Production/飞书写数据，不删除已有资料。"
  - "不声称 AI 能取代专业危机救援或临床风险评估。"
  - "提交 result.json 绑定 task.yaml SHA256 和真实 commit SHA；结果标记 COMPLETE/PARTIAL/BLOCKED，逐 AT 列出证据链接及未覆盖项。"
stop_conditions:
  - "需要修改禁止路径、改变预约字段/导诊业务规则或引入新存储模型但尚未获得变更批准。"
  - "无法证明 Staging 与 Production 关键配置隔离。"
  - "需要部署或写入 Production，或需要合并到 main，但缺少单独的生产/合并授权。"
  - "无法在 Staging 验证任何必选安全链路，或发现新安全回归而不能在限定范围修复。"
  - "现有可验证证据不足或与设计冲突，必须显式 BLOCKED，不得捏造 PASS。"
