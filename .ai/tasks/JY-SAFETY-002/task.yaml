# JY-SAFETY-002 — 防止聊天记录误删与学习授权误删
# 用户已批准本地与隔离 Staging 实施；不等于 Production 发布授权。
protocol: "XSH_AI_DEV_V1"
kind: "task"
task_id: "JY-SAFETY-002"
spec_version: "1.0.0"
state: "APPROVED"
approval:
  user_confirmed: true
  reference: "ChatGPT 当前对话用户消息（2026-11-03）：“批准”；对应 JY-SAFETY-002 极简研发规则 V1.0，仅授权限定范围内本地与隔离 Staging 实施"
project:
  id: "JIEYOU_XIAOWU"
  repo: "xiangshu3721/jieyou-xiaowu-v1"
