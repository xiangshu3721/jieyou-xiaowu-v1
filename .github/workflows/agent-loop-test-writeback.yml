name: Agent Loop Test Writeback (manual)

on:
  workflow_dispatch:
    inputs:
      target_pr:
        description: 'Draft PR number; only PR #46 is accepted in phase 1.'
        required: true
        type: string
      expected_head_sha:
        description: 'Current full 40-character head SHA of the test PR.'
        required: true
        type: string
      operation:
        description: 'Fixed deterministic mutation; arbitrary commands are not accepted.'
        required: true
        type: choice
        default: set_actual_green
        options:
          - set_actual_green
      allowed_path:
        description: 'The only repository path this workflow may change.'
        required: true
        type: choice
        default: docs/agent-loop-test-20261116.md
        options:
          - docs/agent-loop-test-20261116.md

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-loop-test-writeback-${{ inputs.target_pr }}
  cancel-in-progress: false

jobs:
  writeback:
    if: github.repository == 'xiangshu3721/jieyou-xiaowu-v1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      TARGET_BRANCH: codex/jy-agent-loop-test-target-20261116
      ALLOWED_PATH: docs/agent-loop-test-20261116.md
      EXPECTED_PR: '46'
    steps:
      - name: Validate dispatch and fixed PR scope
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.target_pr }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_PATH: ${{ inputs.allowed_path }}
        run: |
          set -euo pipefail
          test "$TARGET_PR" = "$EXPECTED_PR"
          test "$REQUESTED_OPERATION" = "set_actual_green"
          test "$REQUESTED_PATH" = "$ALLOWED_PATH"
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR")"
          export PR_JSON EXPECTED_HEAD_SHA TARGET_BRANCH GITHUB_REPOSITORY
          node --input-type=module <<'NODE'
          const pr = JSON.parse(process.env.PR_JSON);
          const failures = [];
          if (pr.state !== 'open') failures.push('PR must be open');
          if (pr.draft !== true) failures.push('PR must be a draft');
          if (pr.base?.ref !== 'main') failures.push('base branch must be main');
          if (pr.head?.ref !== process.env.TARGET_BRANCH) failures.push('unexpected head branch');
          if (pr.head?.repo?.full_name !== process.env.GITHUB_REPOSITORY) failures.push('fork PRs are forbidden');
          if (pr.head?.sha !== process.env.EXPECTED_HEAD_SHA) failures.push('head SHA does not match dispatch input');
          if (failures.length) throw new Error(failures.join('; '));
          NODE

          FILES_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/files?per_page=100")"
          export FILES_JSON ALLOWED_PATH
          node --input-type=module <<'NODE'
          const files = JSON.parse(process.env.FILES_JSON);
          if (files.length !== 1 || files[0]?.filename !== process.env.ALLOWED_PATH) {
            throw new Error('PR scope is not exactly the allowed test file');
          }
          NODE
          echo "head_sha=$EXPECTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          {
            echo '## Agent Loop Test Writeback'
            echo '- Result: RUNNING (controlled manual verification)'
            echo "- PR: #$TARGET_PR"
            echo "- Base SHA: $EXPECTED_HEAD_SHA"
            echo "- Allowed path: $ALLOWED_PATH"
            echo '- Retry policy: no persistent STOPPED or dedup state is stored; this is not automatic-retry protected.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact Draft PR head without running repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply fixed test-only mutation
        id: mutate
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = process.env.ALLOWED_PATH;
          const text = readFileSync(path, 'utf8');
          if ((text.match(/^expected: green$/gm) ?? []).length !== 1) throw new Error('expected fixture line is missing or duplicated');
          if ((text.match(/^actual: blue$/gm) ?? []).length !== 1) throw new Error('fixture is not at the expected blue state');
          writeFileSync(path, text.replace(/^actual: blue$/m, 'actual: green'));
          NODE

      - name: Reject scope or content drift
        id: guard
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "$ALLOWED_PATH"
          test "$(git diff --numstat | awk '{print $1 ":" $2 ":" $3}')" = "1:1:$ALLOWED_PATH"
          test "$(grep -cx 'actual: green' "$ALLOWED_PATH")" = '1'
          test "$(grep -cx 'actual: blue' "$ALLOWED_PATH" || true)" = '0'

      - name: Commit and push only the fixed test file
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ALLOWED_PATH"
          git commit -m 'test: set agent loop fixture green'
          COMMIT_SHA="$(git rev-parse HEAD)"
          ASKPASS="$RUNNER_TEMP/agent-loop-git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Re-read remote SHA, file, and PR diff
        id: verify_remote
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.target_pr }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$COMMIT_SHA"

          gh api "repos/$GITHUB_REPOSITORY/contents/$ALLOWED_PATH?ref=$REMOTE_SHA" --jq .content | base64 --decode > /tmp/remote-test-file.md
          cmp --silent "$ALLOWED_PATH" /tmp/remote-test-file.md
          test "$(grep -cx 'actual: green' /tmp/remote-test-file.md)" = '1'

          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR")"
          FILES_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/files?per_page=100")"
          export PR_JSON FILES_JSON COMMIT_SHA ALLOWED_PATH
          node --input-type=module <<'NODE'
          const pr = JSON.parse(process.env.PR_JSON);
          const files = JSON.parse(process.env.FILES_JSON);
          if (pr.head?.sha !== process.env.COMMIT_SHA) throw new Error('PR head does not equal pushed SHA');
          if (files.length !== 1 || files[0]?.filename !== process.env.ALLOWED_PATH) throw new Error('remote PR diff escaped allowed file');
          NODE

      - name: Emit success receipt
        if: success()
        env:
          TARGET_PR: ${{ inputs.target_pr }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
        run: |
          set -euo pipefail
          {
            echo '## Agent Loop Test Writeback'
            echo '- Result: SUCCESS'
            echo "- PR: #$TARGET_PR"
            echo "- Base SHA: $EXPECTED_HEAD_SHA"
            echo "- Remote commit SHA: $COMMIT_SHA"
            echo '- Remote file content and PR diff were re-read and verified.'
            echo '- Retry policy: this was a one-time controlled manual verification, not automatic-retry protected.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit stop receipt
        if: failure()
        env:
          TARGET_PR: ${{ inputs.target_pr }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          {
            echo '## Agent Loop Test Writeback'
            echo '- Result: STOPPED'
            echo "- PR: #$TARGET_PR"
            echo "- Base SHA: $EXPECTED_HEAD_SHA"
            echo '- A validation, mutation, guard, push, or remote-readback step failed; no automatic retry was started.'
            echo '- Retry policy: no persistent STOPPED state is stored, so any new dispatch requires manual review.'
          } >> "$GITHUB_STEP_SUMMARY"
